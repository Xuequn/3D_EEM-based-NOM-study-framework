[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eem-reducing-capacity"
version = "2.0.0"
description = "Interpretable CNN workflow for predicting humic-acid reducing capacity from EEM fluorescence"
readme = "README.md"
requires-python = ">=3.9,<3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "ruff>=0.5,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
